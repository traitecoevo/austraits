url: https://traitecoevo.github.io/austraits/

home:
  title: An R package for accessing the AusTraits database
  description: Explore and wrangle curated database of plant traits of Australian flora

development:
  mode: release

template:
  bootswatch: litera
  bootstrap: 5
  
reference:
- title: Load AusTraits
- contents:
  - load_austraits
  - starts_with("get_")

- title: Map AusTraits data
- contents:
  - plot_locations

- title: Functions from traits.use
  desc: Re-exported from traits.use, where they are documented
- contents:
  - reexports
  
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - news
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    intro:
      text: Get Started
      href: articles/austraits.html

    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/traitecoevo/austraits/
